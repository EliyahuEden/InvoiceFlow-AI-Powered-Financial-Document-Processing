name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (pytest + PostgreSQL/pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: invoiceflow
          POSTGRES_PASSWORD: invoiceflow_dev
          POSTGRES_DB: invoiceflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U invoiceflow" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      TEST_PG_HOSTPORT: localhost:5432
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: System packages (Hebrew-capable font for synthetic PDFs)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - name: Initialise database roles and test database
        env:
          PGPASSWORD: invoiceflow_dev
        run: psql -h localhost -U invoiceflow -d invoiceflow -v ON_ERROR_STOP=1 -f infra/postgres/init.sql
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run tests
        working-directory: backend
        run: python -m pytest -q --cov=app --cov-report=term-missing:skip-covered

  frontend:
    name: Frontend (typecheck, lint, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Docker Compose + Playwright)
    runs-on: ubuntu-24.04 # Playwright 1.55 supports Noble, while ubuntu-latest can select 26.04.
    needs: [backend, frontend]
    env:
      RERANKER_BACKEND: none   # keep CI downloads small; the benchmark documents the reranker separately
      LLM_PROVIDER: offline    # never call a paid model from CI
      RATE_LIMIT_LOGIN_PER_MINUTE: "300"   # parallel Playwright workers log in as the same demo users
      RATE_LIMIT_SIGNUP_PER_HOUR: "1000"   # the account tests sign up several businesses
      E2E_MAILPIT_URL: http://localhost:8025   # the account tests read reset and invitation emails here
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: Seed the demo organization
        run: docker compose exec -T api python -m app.cli seed --reset
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200 api worker web
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
