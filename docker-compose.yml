name: invoiceflow

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://invoiceflow_app:invoiceflow_app_dev@postgres:5432/invoiceflow
  MIGRATION_DATABASE_URL: postgresql+psycopg://invoiceflow:invoiceflow_dev@postgres:5432/invoiceflow
  REDIS_URL: redis://redis:6379/0
  STORAGE_BACKEND: s3
  S3_ENDPOINT_URL: http://s3:8333
  S3_ACCESS_KEY: invoiceflow
  S3_SECRET_KEY: invoiceflow_dev_secret
  S3_BUCKET: invoiceflow-documents
  S3_SSE: ${S3_SSE:-none}            # AES256 or aws:kms in production
  S3_KMS_KEY_ID: ${S3_KMS_KEY_ID:-}
  JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-0123456789abcdef0123456789}
  LLM_PROVIDER: ${LLM_PROVIDER:-offline}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-fastembed}
  RERANKER_BACKEND: ${RERANKER_BACKEND:-fastembed}
  MODEL_CACHE_DIR: /models
  EVAL_RESULTS_DIR: /srv/eval/results
  ENVIRONMENT: ${ENVIRONMENT:-development}
  RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE:-10}   # raised only for parallel E2E runs

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: invoiceflow
      POSTGRES_PASSWORD: invoiceflow_dev
      POSTGRES_DB: invoiceflow
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoiceflow -d invoiceflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for local development (SeaweedFS, Apache-2.0).
  # MinIO community images are no longer publicly pullable, see docs/ARCHITECTURE.md.
  s3:
    image: chrislusf/seaweedfs:3.80
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-volume.max=5"]
    ports: ["8333:8333"]
    volumes:
      - s3data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: ["sh", "-c", "python -m app.cli migrate && uvicorn app.main:app --host 0.0.0.0 --port 8000 --timeout-graceful-shutdown 5"]
    environment: *backend-env
    ports: ["8010:8000"]
    volumes: [models:/models, ./eval:/srv/eval]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 30

  worker:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: ["python", "-m", "app.worker"]
    environment: *backend-env
    volumes: [models:/models, ./eval:/srv/eval]
    depends_on:
      api: { condition: service_healthy }

  web:
    build: { context: ./frontend, args: { BACKEND_URL: "http://api:8000" } }
    environment:
      BACKEND_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  s3data:
  models:
