name: invoiceflow

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://invoiceflow_app:invoiceflow_app_dev@postgres:5432/invoiceflow
  MIGRATION_DATABASE_URL: postgresql+psycopg://invoiceflow:invoiceflow_dev@postgres:5432/invoiceflow
  REDIS_URL: redis://redis:6379/0
  STORAGE_BACKEND: s3
  S3_ENDPOINT_URL: http://s3:8333
  S3_ACCESS_KEY: invoiceflow
  S3_SECRET_KEY: invoiceflow_dev_secret
  S3_BUCKET: invoiceflow-documents
  S3_SSE: ${S3_SSE:-none}            # AES256 or aws:kms in production
  S3_KMS_KEY_ID: ${S3_KMS_KEY_ID:-}
  JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-0123456789abcdef0123456789}
  LLM_PROVIDER: ${LLM_PROVIDER:-openai}      # Groq by default; no key = offline
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.groq.com/openai/v1}
  EXTRACTION_MODE: ${EXTRACTION_MODE:-rules_first}
  LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-8000}
  LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
  AI_DAILY_TOKEN_BUDGET: ${AI_DAILY_TOKEN_BUDGET:-100000}   # per business per day, then offline; 0 = unlimited
  RATE_LIMIT_AI_PER_MINUTE: ${RATE_LIMIT_AI_PER_MINUTE:-20}
  # Email: the local Mailpit inbox (http://localhost:8025) by default. For real delivery set SMTP_HOST, SMTP_PORT,
  # SMTP_USERNAME, SMTP_PASSWORD, SMTP_SECURITY (starttls|ssl) and EMAIL_FROM in .env.
  EMAIL_BACKEND: ${EMAIL_BACKEND:-auto}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_SECURITY: ${SMTP_SECURITY:-none}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  EMAIL_FROM: ${EMAIL_FROM:-InvoiceFlow <no-reply@invoiceflow.local>}
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
  EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-fastembed}
  RERANKER_BACKEND: ${RERANKER_BACKEND:-fastembed}
  MODEL_CACHE_DIR: /models
  EVAL_RESULTS_DIR: /srv/eval/results
  ENVIRONMENT: ${ENVIRONMENT:-development}
  RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE:-10}   # raised only for parallel E2E runs

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: invoiceflow
      POSTGRES_PASSWORD: invoiceflow_dev
      POSTGRES_DB: invoiceflow
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoiceflow -d invoiceflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for local development (SeaweedFS, Apache-2.0).
  # MinIO community images are no longer publicly pullable, see docs/ARCHITECTURE.md.
  s3:
    image: chrislusf/seaweedfs:3.80
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-volume.max=5"]
    ports: ["8333:8333"]
    volumes:
      - s3data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  mailpit:  # local test inbox: every email the app sends appears at http://localhost:8025 (nothing leaves the machine)
    image: axllent/mailpit:v1.21.8
    ports: ["8025:8025"]

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: ["sh", "-c", "python -m app.cli migrate && uvicorn app.main:app --host 0.0.0.0 --port 8000 --timeout-graceful-shutdown 5"]
    environment: *backend-env
    ports: ["8010:8000"]
    volumes: [models:/models, ./eval:/srv/eval]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 30

  worker:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: ["python", "-m", "app.worker"]
    environment: *backend-env
    volumes: [models:/models, ./eval:/srv/eval]
    depends_on:
      api: { condition: service_healthy }

  web:
    build: { context: ./frontend, args: { BACKEND_URL: "http://api:8000" } }
    environment:
      BACKEND_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }

  backup:  # nightly database dumps (infra/backup). Local: docker compose --profile backup up -d backup
    build: { context: ./infra/backup }
    profiles: ["backup"]
    environment:
      PGHOST: postgres
      PGUSER: invoiceflow
      PGPASSWORD: ${POSTGRES_PASSWORD:-invoiceflow_dev}
      PGDATABASE: invoiceflow
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_S3_URI: ${BACKUP_S3_URI:-}            # offsite copy, e.g. s3://my-backups/invoiceflow
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_KEY:-}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:-auto}
      AWS_ENDPOINT_URL: ${BACKUP_S3_ENDPOINT:-}    # for R2, B2 or another S3-compatible store
    volumes:
      - backups:/backups
    depends_on:
      postgres: { condition: service_healthy }

  caddy:  # HTTPS front door (infra/caddy/Caddyfile). Local: docker compose --profile proxy up -d -> http://localhost:8080
    image: caddy:2.8.4-alpine
    profiles: ["proxy"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:8080}
    ports: ["8080:8080"]
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_started }

volumes:
  pgdata:
  s3data:
  models:
  caddy_data:
  backups:
